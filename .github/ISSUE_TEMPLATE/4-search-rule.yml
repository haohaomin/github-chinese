name: 屏蔽规则
description: 内置屏蔽规则的增删
title: '[规则] '
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新增
        - 删除
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: 规则
      description: 每行一条
      placeholder: '@octocat'
      render: text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 原因
